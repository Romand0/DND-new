name: OpenWiki Update

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Install OpenWiki
        run: npm install --global openwiki
      
      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          # 基础配置
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          OPENWIKI_MODEL_ID: glm-4.7-flash
          
          # 👇 新增：增加重试次数和超时时间，对抗 429 错误
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: 5
          OPENWIKI_PROVIDER_RETRY_DELAY: 2000
          
          # 👇 新增：延长单次 API 调用的超时时间（毫秒）
          OPENWIKI_PROVIDER_TIMEOUT: 120000
      
      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: "Automated OpenWiki documentation update."
