on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --global openwiki

      - name: 💣 暴力清空所有残留
        run: |
          echo "正在彻底清理环境..."
          rm -rf openwiki .openwiki .last-update.json debug.log
          echo "清理完成"

      - name: 🚀 运行 OpenWiki（基础模式）
        run: openwiki code --update --print
        env:
          DEBUG: openwiki
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          OPENWIKI_MODEL_ID: glm-4-flash
          MCP_DISABLED: "true"

      - name: 📂 检查产出和日志
        run: |
          echo "=== 1. openwiki 目录内容 ==="
          ls -la openwiki/ 2>/dev/null || echo "目录不存在"
          echo ""
          echo "=== 2. 程序运行详细日志 (debug.log) ==="
          cat debug.log 2>/dev/null || echo "日志文件为空"
