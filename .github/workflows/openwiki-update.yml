name: OpenWiki Update

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    # 全局权限依然保留在这里
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          OPENWIKI_MODEL_ID: glm-4-flash
          MCP_DISABLED: "true"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: "Automated OpenWiki documentation update."
          
        # 👇👇👇 核心修复：在这里手动传入 Token 👇👇👇
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
