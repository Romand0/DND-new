on:
  workflow_dispatch: # 只允许手动触发，方便测试

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --global openwiki

      - name: 💣 暴力清空所有残留
        run: |
          echo "正在彻底清理环境..."
          rm -rf openwiki .openwiki .last-update.json
          echo "清理完成"

      - name: 🔍 开启 DEBUG 模式深度排查
        run: openwiki code --update --print --log-level DEBUG
        env:
          # 这里确保你的 Secrets 里有 ZHIPU_API_KEY
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          OPENWIKI_MODEL_ID: glm-4-flash
          # 如果之前加了 MCP_DISABLED 报错，这里先注释掉或删掉
          # MCP_DISABLED: "true" 

      - name: 📂 检查最终产出
        run: |
          echo "=== 最终生成的 openwiki 目录内容 ==="
          ls -la openwiki/
