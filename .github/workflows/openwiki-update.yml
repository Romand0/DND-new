on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with: 
            fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --global openwiki

      - name: 🔄 强制重置状态
        run: |
          rm -rf openwiki
          mkdir -p openwiki

      - name: 🚀 运行 OpenWiki（开启全量调试）
        run: openwiki code --update --print
        env:
          # 👇 开启这个，能看到它到底卡在哪里
          DEBUG: openwiki
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          OPENWIKI_MODEL_ID: glm-4-flash
          MCP_DISABLED: "true"

      - name: 📂 检查最终结果
        run: |
          echo "=== 最终目录结构 ==="
          ls -R openwiki/
